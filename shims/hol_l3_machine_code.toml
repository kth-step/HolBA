[holbuild]
schema = 2
minimum_version = "0.11.0"

[project]
name = "hol_l3_machine_code"

[build]
members = [
  "common",
  "lib",
  "arm8/model",
  "arm8/step",
  "m0/model",
  "m0/step",
]

[actions.Import]
loads = ["fp-sig", "fp-functor"]

# The following mirror Holmake rules in examples/l3-machine-code that compile
# with -toplevel, which holbuild does not infer from load/open. These modules
# are in this package, so they are deps, not loads: holbuild records a load by
# its bare name in the .uo, which then resolves only if the module happens to
# be loaded already.
[actions.FP32]
deps = ["FP"]

[actions.FP64]
deps = ["FP"]

[actions.MutableMap16]
deps = ["Ptree", "Map", "MutableMapFunctor"]

[actions.PureMap]
deps = ["Ptree", "Map"]

[actions.arm8]
deps = ["assemblerLib", "MutableMap16"]

[actions.m0]
deps = ["assemblerLib", "MutableMap16"]
